<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>秘密图压缩矩阵测量</title></head>
<body>
<pre id="log">(pending)</pre>
<div id="stage" style="display:none"></div>
<script>
/*
 * Measures the ACTUAL size of the encoders the app would use, for the secret-image
 * preprocessing ladder. Runs in the browser because canvas.toDataURL('image/jpeg'|'image/png')
 * IS the real encoder on file://, and Node has no JPEG encoder at all.
 *
 * The driver injects the source photo as a data URL AFTER load and then calls runMatrix(),
 * which avoids every navigation/path pitfall that made the earlier corpus generator fail.
 */
(function () {
  const SIZES = [256, 192, 128, 96, 64, 48, 32, 8, 4, 1];
  const JPEG_QUALITIES = [0.85, 0.75, 0.65, 0.55, 0.45];
  // QIMG is analytic: ceil(W*H*bpp/8), but it is also listed so the tables come from one place
  const QIM_BPP = [8, 6, 4, 2, 1];

  function dataUrlBytes(url) {
    const i = url.indexOf(',');
    const b64 = url.slice(i + 1);
    const pad = b64.endsWith('==') ? 2 : (b64.endsWith('=') ? 1 : 0);
    return Math.floor(b64.length * 3 / 4) - pad;
  }

  function canvasFrom(img, side) {
    // preserve aspect ratio, longest side = `side`
    const scale = side / Math.max(img.width, img.height);
    const w = Math.max(1, Math.round(img.width * scale));
    const h = Math.max(1, Math.round(img.height * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    // grayscale first, as the real pipeline does
    g.filter = 'grayscale(1)';
    g.drawImage(img, 0, 0, w, h);
    return c;
  }

  function loadImage(url) {
    return new Promise(function (res, rej) {
      const im = new Image();
      im.onload = function () { res(im); };
      im.onerror = function () { rej(new Error('image load failed')); };
      im.src = url;
    });
  }

  /** A synthetic photo-like source, used when no real photo is injected. */
  function syntheticImage(side) {
    const c = document.createElement('canvas');
    c.width = side; c.height = side;
    const g = c.getContext('2d');
    const im = g.createImageData(side, side);
    let seed = 12345;
    const rnd = function () { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    const N = 64, re = new Float64Array(N * N), im2 = new Float64Array(N * N);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const kx = x <= N / 2 ? x : x - N, ky = y <= N / 2 ? y : y - N;
      const f = Math.sqrt(kx * kx + ky * ky) || 1;
      const amp = Math.pow(f, -0.55), ph = rnd() * Math.PI * 2;
      re[y * N + x] = amp * Math.cos(ph); im2[y * N + x] = amp * Math.sin(ph);
    }
    // trivial inverse: use the real part as a smooth field after a cheap blur
    let mn = Infinity, mx = -Infinity;
    for (let k = 0; k < N * N; k++) { if (re[k] < mn) mn = re[k]; if (re[k] > mx) mx = re[k]; }
    for (let y = 0; y < side; y++) for (let x = 0; x < side; x++) {
      const v = Math.round(255 * (re[(y * N / side | 0) * N + (x * N / side | 0)] - mn) / ((mx - mn) || 1));
      const o = (y * side + x) * 4;
      im.data[o] = im.data[o + 1] = im.data[o + 2] = v; im.data[o + 3] = 255;
    }
    g.putImageData(im, 0, 0);
    return loadImage(c.toDataURL('image/png'));
  }

  window.runMatrix = async function (photoDataUrl) {
    const out = { sizes: SIZES, jpegQualities: JPEG_QUALITIES, qimBpp: QIM_BPP, rows: [], minJpeg: null, source: '' };
    let src;
    if (photoDataUrl) {
      try { src = await loadImage(photoDataUrl); out.source = 'sample.png (real photo)'; }
      catch (e) { src = await syntheticImage(256); out.source = 'synthetic (photo load failed)'; }
    } else {
      src = await syntheticImage(256);
      out.source = 'synthetic 1/f';
    }
    out.sourceSize = { w: src.naturalWidth || src.width, h: src.naturalHeight || src.height };

    for (const side of SIZES) {
      const c = canvasFrom(src, side);
      const row = { side: side, w: c.width, h: c.height, jpeg: {}, png: 0, qimg: {} };
      row.png = dataUrlBytes(c.toDataURL('image/png'));
      for (const q of JPEG_QUALITIES) {
        row.jpeg[q] = dataUrlBytes(c.toDataURL('image/jpeg', q));
      }
      for (const bpp of QIM_BPP) {
        row.qimg[bpp] = Math.ceil(c.width * c.height * bpp / 8);
      }
      out.rows.push(row);
      document.getElementById('log').textContent =
        'measured ' + SIZES.indexOf(side) + 1 + '/' + SIZES.length + ' sizes...';
    }

    // minimum-JPEG probe: how much of a JPEG is pure fixed overhead?
    const tiny = document.createElement('canvas');
    tiny.width = 1; tiny.height = 1;
    const tg = tiny.getContext('2d');
    tg.fillStyle = '#808080'; tg.fillRect(0, 0, 1, 1);
    out.minJpeg = {
      bytes_q085: dataUrlBytes(tiny.toDataURL('image/jpeg', 0.85)),
      bytes_q045: dataUrlBytes(tiny.toDataURL('image/jpeg', 0.45))
    };
    out.ok = true;
    window.__matrix = out;
    document.getElementById('log').textContent = 'DONE';
    return out;
  };
})();
</script>
</body>
</html>
