<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>favicon 预览</title>
<style>
  body { margin:0; background:#20242b; font:12px system-ui,sans-serif; color:#c8d0da; padding:16px; }
  .row { display:flex; align-items:flex-end; gap:26px; margin-bottom:22px; }
  .cell { text-align:center; }
  .cell div { margin-top:6px; color:#8d97a3; font-size:11px; }
  .tab { display:inline-flex; align-items:center; gap:7px; background:#35363a; color:#e8eaed;
         padding:7px 12px; border-radius:8px 8px 0 0; font-size:12.5px; }
  .tab img { width:16px; height:16px; }
</style>
</head>
<body>
  <div class="row">
    <div class="cell"><img src="../favicon.svg" width="128" height="128"><div>128</div></div>
    <div class="cell"><img src="../favicon.svg" width="64" height="64"><div>64</div></div>
    <div class="cell"><img src="../favicon.svg" width="48" height="48"><div>48</div></div>
    <div class="cell"><img src="../favicon.svg" width="32" height="32"><div>32</div></div>
    <div class="cell"><img src="../favicon.svg" width="16" height="16"><div>16</div></div>
  </div>
  <div class="row">
    <div class="tab"><img src="../favicon.svg">Robust SSTV — 抗干扰解码</div>
    <div class="tab"><img src="../favicon.svg">技术报告</div>
  </div>
</body>
</html>
