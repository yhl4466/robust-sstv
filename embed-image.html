</head>
<body>

<div class="wrap page-head">
  <h1>图片隐藏 · 嵌入端</h1>
  <p class="muted">把一张秘密图藏进音频的隐藏频道，公开图仍可被任何播放器正常还原 · 纯前端 · 可直接双击本文件运行</p>
  <p class="subnav"><strong>嵌入端</strong> · <a href="extract-image.html">提取端</a></p>
</div>
<!-- PAGEHEAD:END -->

<main class="wrap">
  <section class="card">
    <div class="row">
      <div class="field">
        <label for="carrierInput">① 公开图（载体）</label>
        <input type="file" id="carrierInput" accept="image/*">
      </div>
      <div class="field">
        <label for="secretInput">② 秘密图</label>
        <input type="file" id="secretInput" accept="image/*">
      </div>
    </div>
    <div class="row3">
      <div class="field">
        <label for="modeSelect">模式</label>
        <select id="modeSelect"></select>
      </div>
      <div class="field">
        <label for="blockSelect">载体块长 B</label>
        <select id="blockSelect"></select>
      </div>
      <div class="field">
        <label for="fecSelect">FEC</label>
        <select id="fecSelect"></select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label><input type="checkbox" id="autoScale" checked> 自动缩放秘密图</label>
      </div>
      <div class="field">
        <label><input type="checkbox" id="dither" checked> 有序抖动</label>
      </div>
    </div>
    <div class="preview two">
      <div>
        <canvas id="carrierCanvas" width="320" height="256"></canvas>
        <div class="preview-meta" id="carrierMeta">公开图（将适配模式栅格）</div>
      </div>
      <div>
        <canvas id="secretCanvas" width="320" height="256"></canvas>
        <div class="preview-meta" id="secretMeta">秘密图</div>
      </div>
    </div>
    <div id="preprocessBox" class="predict" hidden></div>
    <div class="actions">
      <button id="embedBtn" class="primary" disabled>③ 开始嵌入</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="metrics" id="metrics" hidden></div>
    <div class="preview">
      <canvas id="waveCanvas" width="900" height="90"></canvas>
      <div class="preview-meta">音频波形预览</div>
    </div>
    <div class="actions">
      <audio id="player" controls hidden></audio>
      <button id="downloadBtn" class="ghost" disabled>下载 WAV</button>
    </div>
  </section>
</main>

<footer class="wrap site-footer">
  <p class="muted">秘密图经灰度化 + 缩放 + 定点量化后，作为数字边带寄生在公开图的绿色通道里。RS(255,223) + 码字交织保护。</p>
</footer>

<!-- Classic scripts only: ES modules are blocked on file://, so load order matters. -->
<script src="js/lib/fft.js"></script>
<script src="js/lib/sstv-modes.js"></script>
<script src="js/lib/sstv-timeline.js"></script>
<script src="js/lib/sstv-synth.js"></script>
<script src="js/lib/wav.js"></script>
<script src="js/channel-sim.js"></script>
<script src="js/payload-qim.js"></script>
<script src="js/fec-rs.js"></script>
<script src="js/interleaver.js"></script>
<script src="js/payload-pipeline.js"></script>
<script src="js/image-codec.js"></script>
<script src="js/image-embed.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var SAMPLE_RATE = 48000;
  var state = { carrier: null, secret: null, result: null, wavBlob: null };

  function setStatus(kind, html) { var el = $('status'); el.className = 'status' + (kind ? ' ' + kind : ''); el.innerHTML = html || ''; }
  function metricRow(k, v) { return '<div class="metric"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }

  function fillSelect(el, items, valKey, labelKey, def) {
    el.innerHTML = '';
    items.forEach(function (it) {
      var o = document.createElement('option');
      o.value = String(it[valKey]); o.textContent = it[labelKey]; el.appendChild(o);
    });
    if (def != null) el.value = String(def);
  }

  function readFileAsImage(file) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onerror = function () { rej(new Error('读取文件失败')); };
      fr.onload = function () {
        var im = new Image();
        im.onload = function () { res(im); };
        im.onerror = function () { rej(new Error('图片解码失败')); };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  /** Fit an image into the mode raster with black letterbox, exactly like the app does. */
  function fitToRaster(img, w, h) {
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var g = c.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
    var s = Math.min(w / img.naturalWidth, h / img.naturalHeight);
    var dw = Math.max(1, Math.round(img.naturalWidth * s)), dh = Math.max(1, Math.round(img.naturalHeight * s));
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    g.drawImage(img, Math.floor((w - dw) / 2), Math.floor((h - dh) / 2), dw, dh);
    return g.getImageData(0, 0, w, h);
  }
  /** Any image -> RGBA raster at its own size (the codec resizes it). */
  function toImageData(img, maxSide) {
    var w = img.naturalWidth, h = img.naturalHeight;
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0);
    return c.getContext('2d').getImageData(0, 0, w, h);
  }
  function drawImageData(canvas, imageData, boxW, boxH) {
    canvas.width = boxW; canvas.height = boxH;
    var g = canvas.getContext('2d');
    g.fillStyle = '#111'; g.fillRect(0, 0, boxW, boxH);
    var s = Math.min(boxW / imageData.width, boxH / imageData.height);
    var tmp = document.createElement('canvas');
    tmp.width = imageData.width; tmp.height = imageData.height;
    tmp.getContext('2d').putImageData(new ImageData(imageData.data, imageData.width, imageData.height), 0, 0);
    g.imageSmoothingEnabled = false;   // show the secret at its true (tiny) resolution
    g.drawImage(tmp, (boxW - imageData.width * s) / 2, (boxH - imageData.height * s) / 2,
      imageData.width * s, imageData.height * s);
  }
  function drawWave(canvas, samples) {
    var g = canvas.getContext('2d');
    var w = canvas.width, h = canvas.height;
    g.fillStyle = '#111'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#4ade80'; g.beginPath();
    var step = Math.max(1, Math.floor(samples.length / w));
    for (var x = 0; x < w; x++) {
      var lo = 1, hi = -1;
      for (var k = 0; k < step; k++) {
        var v = samples[x * step + k] || 0;
        if (v < lo) lo = v;
        if (v > hi) hi = v;
      }
      g.moveTo(x + 0.5, (1 - hi) * h / 2);
      g.lineTo(x + 0.5, (1 - lo) * h / 2);
    }
    g.stroke();
  }

  function currentOptions() {
    var b = parseInt($('blockSelect').value, 10);
    var nsym = parseInt($('fecSelect').value, 10);
    return { mode: $('modeSelect').value, blockSize: b, delta: 12, nsym: nsym,
             autoScale: $('autoScale').checked, dither: $('dither').checked, sampleRate: SAMPLE_RATE };
  }

  /** Dry-run the preprocessing so the user sees the cost BEFORE committing to a 115 s encode. */
  function refreshPreprocess() {
    var box = $('preprocessBox');
    if (!state.secret || !state.carrier) { box.hidden = true; return; }
    var o = currentOptions();
    var mode = window.SSTVModes.get(o.mode);
    var raster = fitToRaster(state.carrier, mode.width, mode.height);
    drawImageData($('carrierCanvas'), raster, 320, 256);
    drawImageData($('secretCanvas'), state.secret, 320, 256);

    var cfg = { blockSize: o.blockSize, delta: o.delta, nsym: o.nsym, codewordLength: 'auto', interleaveDepth: 32 };
    var cap = window.PayloadPipeline.capacity(raster, cfg);
    var budget = cap.payloadBytes - window.ImageCodec.HEADER_BYTES;
    var sel = window.ImageCodec.chooseBest(state.secret, {
      dataBudget: budget, autoScale: o.autoScale, dither: o.dither
    });
    if (!sel.ok) {
      box.className = 'predict bad'; box.hidden = false;
      box.innerHTML = '<div class="predict-verdict">无法嵌入：' + sel.reason + '</div>' +
        '<div class="predict-notes">秘密图过大或长宽比过于极端。可尝试：勾选自动缩放 / 增大块长 B / 降低 FEC 强度。</div>';
      $('embedBtn').disabled = true;
      return;
    }
    var b = sel.best;
    var rows = [
      ['秘密图最终尺寸', b.w + '×' + b.h + '（原 ' + state.secret.width + '×' + state.secret.height + '）'],
      ['量化', b.bpp + ' bit/像素 · ' + (1 << b.bpp) + ' 级' + (o.dither ? ' · 抖动' : '')],
      ['图象数据', b.dataBytes + ' B / 预算 ' + budget + ' B'],
      ['帧总长', (b.dataBytes + window.ImageCodec.HEADER_BYTES) + ' B / 载荷 ' + cap.payloadBytes + ' B'],
      ['重建 PSNR', b.psnr.toFixed(2) + ' dB'],
      ['自动缩放', b.autoScaled ? '是' : '否']
    ];
    box.className = 'predict ' + (b.autoScaled ? 'ok' : 'ok');
    box.hidden = false;
    box.innerHTML = '<div class="predict-verdict">可嵌入：秘密图将压缩为 ' + b.w + '×' + b.h +
      '，' + b.bpp + 'bpp，占 ' + b.dataBytes + ' B</div>' +
      '<div class="grid-metrics">' + rows.map(function (r) { return metricRow(r[0], r[1]); }).join('') + '</div>' +
      '<div class="predict-notes">注：秘密图很小，只保留大致轮廓与明暗；细节会丢失。</div>';
    $('embedBtn').disabled = false;
  }

  $('carrierInput').addEventListener('change', async function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      state.carrier = await readFileAsImage(f);
      $('carrierMeta').textContent = '公开图 ' + state.carrier.naturalWidth + '×' + state.carrier.naturalHeight + ' → ' + window.SSTVModes.get($('modeSelect').value).name;
      refreshPreprocess();
    } catch (err) { setStatus('err', '读取公开图失败：' + err.message); }
  });
  $('secretInput').addEventListener('change', async function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      // keep the secret as ImageData (the codec consumes RGBA rasters), unlike the carrier
      // which stays an <img> so it can be re-fitted to the mode raster on every change
      state.secret = toImageData(await readFileAsImage(f));
      $('secretMeta').textContent = '秘密图 ' + state.secret.width + '×' + state.secret.height + '（灰度化后压缩）';
      refreshPreprocess();
    } catch (err) { setStatus('err', '读取秘密图失败：' + err.message); }
  });
  ['modeSelect', 'blockSelect', 'fecSelect', 'autoScale', 'dither'].forEach(function (id) {
    $(id).addEventListener('change', refreshPreprocess);
  });

  $('embedBtn').addEventListener('click', function () {
    if (!state.carrier || !state.secret) return;
    var o = currentOptions();
    var mode = window.SSTVModes.get(o.mode);
    var raster = fitToRaster(state.carrier, mode.width, mode.height);
    setStatus('', '正在嵌入…（生成 ' + mode.name + ' 音频约需 0.3–1 秒）');
    $('embedBtn').disabled = true;
    setTimeout(function () {
      var t0 = Date.now();
      var res = window.ImageEmbed.embedImage(raster, state.secret, o);
      if (!res.ok) {
        setStatus('err', '嵌入失败：' + res.reason);
        $('embedBtn').disabled = false;
        return;
      }
      state.result = res;
      var i = res.embeddedInfo;
      drawWave($('waveCanvas'), res.audioSamples);
      var wav = window.SSTVWav.encode(res.audioSamples, SAMPLE_RATE);
      state.wavBlob = new Blob([wav], { type: 'audio/wav' });
      var url = URL.createObjectURL(state.wavBlob);
      var pl = $('player'); pl.src = url; pl.hidden = false;
      $('downloadBtn').disabled = false;
      $('downloadBtn').onclick = function () {
        var a = document.createElement('a');
        a.href = url; a.download = 'sstv_hidden_' + o.mode + '.wav';
        document.body.appendChild(a); a.click(); a.remove();
      };
      var rows = [
        ['秘密图最终', i.secretFinalSize.W + '×' + i.secretFinalSize.H + ' · ' + i.bpp + 'bpp · ' + (1 << i.bpp) + ' 级'],
        ['图象数据 / 帧', i.secretDataBytes + ' B / ' + i.frameBytes + ' B'],
        ['载荷容量', i.capacity + ' B'],
        ['码几何', 'n=' + i.codewordLength + ' nsym=' + i.nsym + ' × ' + i.codewords + ' 码字'],
        ['重建 PSNR', i.reconstructionPsnr.toFixed(2) + ' dB'],
        ['自动缩放', i.autoResized ? '是' : '否'],
        ['音频', i.duration.toFixed(2) + ' s · ' + (wav.length / 1048576).toFixed(2) + ' MB'],
        ['耗时', (Date.now() - t0) + ' ms（预处理 ' + i.preprocessMs + ' · 载荷 ' + i.encodeMs + ' · 合成 ' + i.synthMs + '）']
      ];
      $('metrics').innerHTML = '<div class="grid-metrics">' + rows.map(function (r) { return metricRow(r[0], r[1]); }).join('') + '</div>';
      $('metrics').hidden = false;
      setStatus('ok', '嵌入完成。音频可试听或下载；对方用「提取端」可同时得到公开图与秘密图。');
      $('embedBtn').disabled = false;
    }, 30);
  });

  // ---- boot
  fillSelect($('modeSelect'), window.SSTVModes.list().map(function (m) {
    return { id: m.id, label: m.name + ' (' + m.width + '×' + m.height + ')' };
  }), 'id', 'label', 'M1');
  fillSelect($('blockSelect'), [16, 32, 48, 64].map(function (b) { return { v: b, l: b + ' 像素/位' }; }), 'v', 'l', 32);
  fillSelect($('fecSelect'), [{ v: 32, l: 'RS(255,223) 纠16' }, { v: 64, l: 'RS(255,191) 纠32' }, { v: 0, l: '无 FEC' }], 'v', 'l', 32);
  window.__embedPageReady = true;
})();
</script>
</body>
</html>
