<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抗干扰 SSTV 解码平台 · 图片隐藏（提取端）</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- NAV:BEGIN (generated by scripts/nav-partial.js - do not edit by hand) -->
<header class="site-nav">
  <div class="wrap nav-inner">
    <a class="brand" href="index.html">Robust SSTV</a>
    <input type="checkbox" id="navToggle" class="nav-toggle-cb" aria-hidden="true">
    <label for="navToggle" class="nav-toggle-btn" aria-label="展开导航菜单">菜单</label>
    <nav class="nav-links" aria-label="主导航">
      <a href="index.html">首页</a>
      <a href="embed-image.html">图片隐藏</a>
      <a href="tech.html">技术报告</a>
    </nav>
  </div>
</header>
<!-- NAV:END -->
<!-- PAGEHEAD:BEGIN (generated by scripts/nav-partial.js) -->
<div class="wrap page-head">
  <h1>图片隐藏 · 提取端</h1>
  <p class="muted">从音频里同时还原公开图与秘密图 · 纯前端 · 可直接双击本文件运行</p>
  <p class="subnav"><a href="embed-image.html">嵌入端</a> · <strong>提取端</strong></p>
</div>
<!-- PAGEHEAD:END -->

<main class="wrap">
  <section class="card">
    <div class="row">
      <div class="field">
        <label for="wavInput">① 选择 WAV 文件</label>
        <input type="file" id="wavInput" accept=".wav,.m4a,.mp3,.ogg,.oga,.opus,.aac,.flac,.webm,.mp4,.m4v,.mov,.3gp,audio/*,video/*">
      </div>
      <div class="field">
        <label for="blockSelect">载体块长 B</label>
        <select id="blockSelect"></select>
      </div>
      <div class="field">
        <label for="fecSelect">FEC</label>
        <select id="fecSelect"></select>
      </div>
    </div>
    <div class="actions">
      <button id="extractBtn" class="primary" disabled>② 开始提取</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="progress-wrap" id="progressWrap" hidden>
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-label" id="progressLabel"></div>
    </div>
    <div class="metrics" id="metrics" hidden></div>
    <div class="preview two">
      <div>
        <canvas id="publicCanvas" width="320" height="256"></canvas>
        <div class="preview-meta" id="publicMeta">公开图（SSTV 主通道）</div>
        <div class="actions"><button id="savePublic" class="ghost" disabled>下载公开图 PNG</button></div>
      </div>
      <div>
        <canvas id="secretCanvas" width="320" height="256"></canvas>
        <div class="preview-meta" id="secretMeta">秘密图（数字边带）</div>
        <div class="actions"><button id="saveSecret" class="ghost" disabled>下载秘密图 PNG</button></div>
      </div>
    </div>
  </section>
</main>

<footer class="wrap site-footer">
  <p class="muted">公开图来自模拟 SSTV 解调；秘密图来自寄生在绿色通道的数字边带，经 RS 纠错与解交织恢复。</p>
</footer>

<script src="js/lib/fft.js"></script>
<script src="js/lib/sstv-modes.js"></script>
<script src="js/lib/sstv-timeline.js"></script>
<script src="js/lib/sstv-synth.js"></script>
<script src="js/lib/wav.js"></script>
<script src="js/lib/sstv-decode.js"></script>
<script src="js/payload-qim.js"></script>
<script src="js/fec-rs.js"></script>
<script src="js/interleaver.js"></script>
<script src="js/payload-pipeline.js"></script>
<script src="js/lib/audio-input.js"></script>
<script src="js/decoder.js"></script>
<script src="js/image-codec.js"></script>
<script src="js/image-extract.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var state = { samples: null, sampleRate: 48000, publicImage: null, secretImage: null, busy: false };

  function setStatus(kind, html) { var el = $('status'); el.className = 'status' + (kind ? ' ' + kind : ''); el.innerHTML = html || ''; }
  /** setStatus writes innerHTML, and the file name in it comes from the user - escape it. */
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function metricRow(k, v) { return '<div class="metric"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }
  function showProgress(f, label) {
    $('progressWrap').hidden = false;
    $('progressBar').style.width = Math.round(100 * f) + '%';
    $('progressLabel').textContent = label || '';
  }
  function fillSelect(el, items, valKey, labelKey, def) {
    el.innerHTML = '';
    items.forEach(function (it) {
      var o = document.createElement('option');
      o.value = String(it[valKey]); o.textContent = it[labelKey]; el.appendChild(o);
    });
    if (def != null) el.value = String(def);
  }
  function drawImageData(canvas, imageData) {
    canvas.width = imageData.width; canvas.height = imageData.height;
    canvas.getContext('2d').putImageData(
      new ImageData(imageData.data, imageData.width, imageData.height), 0, 0);
  }
  function saveCanvas(canvas, name) {
    var a = document.createElement('a');
    a.href = canvas.toDataURL('image/png'); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  function currentReceiverOptions() {
    return {
      blockSize: parseInt($('blockSelect').value, 10),
      delta: 12,
      nsym: parseInt($('fecSelect').value, 10),
      interleaveDepth: 32,
      quality: 'standard'
    };
  }

  $('wavInput').addEventListener('change', async function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    /*
     * Same format-aware layer as the main page: WAV is parsed natively (native sample rate), and
     * anything else - a phone screen recording in M4A/MP4/WebM - goes through the browser decoder
     * instead of being refused. Note the payload is read from quantised block means in the IMAGE
     * domain, so it is more sensitive to resampling than the public image is; see the phase
     * report for what actually survives a transcode.
     */
    var parsed = await window.SSTVDecoder.parseAudio(f, {
      onStage: function (text) { setStatus('', esc(text) + '…'); }
    });
    if (!parsed.ok) { setStatus('err', parsed.message); return; }
    state.samples = parsed.samples; state.sampleRate = parsed.sampleRate;
    setStatus('', '已载入 <b>' + esc(f.name) + '</b> · ' + parsed.sampleRate + ' Hz · ' +
      parsed.channels + ' 声道 · ' + parsed.duration.toFixed(2) + ' s · ' + esc(parsed.format) +
      (parsed.transcoded ? '（已转码）' : '（原生采样率）') +
      (parsed.warning ? '<br><span class="warn">⚠ ' + esc(parsed.warning) + '</span>' : ''));
    $('extractBtn').disabled = false;
    window.__extractWavLoaded = true;
  });

  $('extractBtn').addEventListener('click', async function () {
    if (!state.samples || state.busy) return;
    state.busy = true; $('extractBtn').disabled = true;
    setStatus('', '正在提取…（无 Worker，分块让出以保持界面响应）');
    $('metrics').hidden = true;
    $('progressWrap').hidden = false;
    var t0 = Date.now();
    try {
      var res = await window.ImageExtract.extractImage(state.samples, state.sampleRate,
        Object.assign(currentReceiverOptions(), {
          onProgress: showProgress,
          yieldFn: function () { return new Promise(function (r) { requestAnimationFrame(r); }); },
          yieldEvery: 4
        }));
      $('progressWrap').hidden = true;

      if (!res.publicImage) {
        setStatus('err', '提取失败（' + res.stage + '）：' + res.reason);
        state.busy = false; $('extractBtn').disabled = false;
        return;
      }
      state.publicImage = res.publicImage;
      drawImageData($('publicCanvas'), res.publicImage);
      $('savePublic').disabled = false;
      $('savePublic').onclick = function () { saveCanvas($('publicCanvas'), 'sstv_public.png'); };
      $('publicMeta').textContent = '公开图 ' + res.publicImage.width + '×' + res.publicImage.height +
        ' · ' + (res.publicMeta.mode || '');

      if (res.secretImage) {
        state.secretImage = res.secretImage;
        drawImageData($('secretCanvas'), res.secretImage);
        $('saveSecret').disabled = false;
        $('saveSecret').onclick = function () { saveCanvas($('secretCanvas'), 'sstv_secret.png'); };
      } else {
        var g = $('secretCanvas').getContext('2d');
        g.fillStyle = '#1a1a1a'; g.fillRect(0, 0, 320, 256);
        g.fillStyle = '#f87171'; g.font = '16px sans-serif';
        g.fillText('秘密图未能恢复', 20, 120);
        g.font = '12px sans-serif'; g.fillStyle = '#9ca3af';
        g.fillText((res.secretMeta && res.secretMeta.reason || '').slice(0, 40), 20, 142);
      }

      var cal = res.publicMeta.calibration || {};
      var st = res.stats || {};
      var sm = res.secretMeta || {};
      var rows = [
        ['模式', (res.publicMeta.mode || '-') + ' · ' + res.publicImage.width + '×' + res.publicImage.height],
        ['接收端标定', 'a=' + (cal.scale || 1).toFixed(5) + ' b=' + (cal.offsetHz || 0).toFixed(2) + ' Hz' +
          (cal.clockScale != null ? ' 时钟×' + cal.clockScale.toFixed(5) : '')],
        ['标定来源', (cal.source || '-') + (cal.observations ? '（' + cal.observations + ' 个同步）' : '')],
        ['擦除率（比特/字节）', (100 * (st.bitErasureRate || 0)).toFixed(1) + '% / ' + (100 * (st.byteErasureRate || 0)).toFixed(1) + '%'],
        ['RS 块正确率', st.codewords ? (100 * st.codewordsOk / st.codewords).toFixed(0) + '% (' + st.codewordsOk + '/' + st.codewords + ')' : '-'],
        ['数字边带帧', sm.payloadRecovered ? '校验通过' : '失败'],
        ['秘密图', sm.success ? sm.W + '×' + sm.H + ' · ' + sm.bpp + 'bpp · ' + sm.dataBytes + ' B' : '未恢复'],
        ['耗时', (Date.now() - t0) + ' ms']
      ];
      $('metrics').innerHTML = '<div class="grid-metrics">' + rows.map(function (r) { return metricRow(r[0], r[1]); }).join('') + '</div>';
      $('metrics').hidden = false;

      if (sm.success) {
        setStatus('ok', '提取成功：公开图与秘密图均已恢复（秘密图逐字节与发送端一致）。');
        window.__extractSecretOk = true;
      } else {
        setStatus('err', '公开图已恢复，但<b>秘密图未能恢复</b>：' + (sm.reason || res.reason || '未知原因') +
          '。可尝试把 B 改为 48 或 64（秘密图会变小但更稳），或确认接收端几何与发送端一致。');
      }
      window.__extractDone = true;
    } catch (err) {
      $('progressWrap').hidden = true;
      setStatus('err', '提取异常：' + err.message);
    } finally {
      state.busy = false; $('extractBtn').disabled = false;
    }
  });

  fillSelect($('blockSelect'), [16, 32, 48, 64].map(function (b) { return { v: b, l: b + ' 像素/位' }; }), 'v', 'l', 32);
  fillSelect($('fecSelect'), [{ v: 32, l: 'RS(255,223) 纠16' }, { v: 64, l: 'RS(255,191) 纠32' }, { v: 0, l: '无 FEC' }], 'v', 'l', 32);
  window.__extractPageReady = true;
})();
</script>
</body>
</html>
